services:
  mysql:
    image: mysql:8.4
    container_name: baramail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${DB_NAME:-baramail}
      MYSQL_USER: ${DB_USER:-baramail_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: baramail-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      TRUSTED_PROXIES: 127.0.0.1,172.16.0.0/12
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    container_name: baramail-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge

